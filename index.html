<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario Question Trainer — CIPFA Audit &amp; Assurance Q9–Q12</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--surface:#fff;--surface-2:#f1f5f9;--text:#0f172a;--text-2:#64748b;--border:#e2e8f0;
 --accent:#6366f1;--accent-2:#8b5cf6;--accent-bg:#eef2ff;--ok:#059669;--ok-bg:#ecfdf5;--bad:#dc2626;--bad-bg:#fef2f2;
 --warn:#b45309;--warn-bg:#fffbeb;--r:16px;--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05)}
[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--text:#f1f5f9;--text-2:#94a3b8;--border:#334155;
 --accent:#818cf8;--accent-2:#a78bfa;--accent-bg:#312e81;--ok:#34d399;--ok-bg:#064e3b;--bad:#f87171;--bad-bg:#7f1d1d;
 --warn:#fbbf24;--warn-bg:#78350f;--shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
button,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.mast{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.1rem;letter-spacing:-.02em;line-height:1.2}
.brand span{display:block;font-size:.68rem;font-weight:700;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.timer{font-weight:800;font-size:1.05rem;padding:5px 12px;border-radius:999px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.wrap{max-width:900px;margin:0 auto;padding:22px 20px 60px}
.btn{padding:10px 18px;border-radius:12px;font-weight:700;font-size:.9rem;background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--shadow);transition:all .15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.btn-primary:hover{opacity:.92;border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-sm{padding:6px 12px;font-size:.8rem;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:16px}
h1{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:6px} h2{font-size:1.15rem} h3{font-size:.98rem;margin-bottom:6px}
.lede{color:var(--text-2);font-size:.95rem;margin-bottom:18px;max-width:64ch} .lede b{color:var(--text)}
.small{font-size:.85rem;color:var(--text-2);margin-top:10px}
.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:8px}
.howgrid div{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:.88rem}
.howgrid span{display:block;color:var(--text-2);font-size:.82rem;margin-top:3px}
.grp{margin-bottom:14px}
.grp-h{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin:0 0 7px 2px}
.case-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;margin-bottom:8px;border:1.5px solid var(--border);
 border-radius:12px;background:var(--surface);box-shadow:var(--shadow);transition:all .14s}
.case-btn:hover{border-color:var(--accent)} .case-btn.done{border-color:var(--ok);background:var(--ok-bg)}
.cb-t{flex:1} .cb-t span{display:block;font-size:.8rem;color:var(--text-2)}
.cb-s{font-size:.8rem;font-weight:800;color:var(--accent);white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:17px;box-shadow:var(--shadow);transition:all .15s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)} .mode p{font-size:.85rem;color:var(--text-2);margin-top:4px}
.scen{font-size:.93rem} .scen p{margin-bottom:9px}
.sc-list{margin:6px 0 4px 20px} .sc-list li{margin-bottom:7px}
.scen-mini summary{cursor:pointer;font-weight:800;font-size:.9rem;list-style:none}
.scen-mini summary::-webkit-details-marker{display:none}
.scen-mini[open] summary{margin-bottom:10px} .scen-mini{font-size:.9rem;padding:14px 18px}
.qhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.qnum{font-weight:800;font-size:.85rem;background:var(--accent);color:#fff;padding:4px 12px;border-radius:999px}
.tag{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.marks{margin-left:auto;font-size:.8rem;font-weight:800;color:var(--text-2)}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
.stem{font-size:1rem;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:9px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)} .opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.missed{border-color:var(--ok);border-style:dashed} .opt.locked{cursor:default}
.opt input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex-shrink:0}
.opt-body{flex:1} .why{font-size:.84rem;color:var(--text-2);margin-top:6px;line-height:1.5}
.mrow{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.mrow.ok{border-color:var(--ok);background:var(--ok-bg)} .mrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.mrow-t{font-weight:700;font-size:.92rem;margin-bottom:7px}
.mrow select{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--bg);font-size:.88rem}
.req{background:var(--accent-bg);border-left:4px solid var(--accent);padding:12px 15px;border-radius:0 12px 12px 0;margin-bottom:12px;font-size:.93rem}
textarea{width:100%;min-height:220px;padding:13px;border:1.5px solid var(--border);border-radius:12px;font-size:.92rem;background:var(--bg);resize:vertical;line-height:1.6}
.mark-h{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:16px 0 9px}
.mp{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:7px;cursor:pointer;font-size:.88rem}
.mp.on{background:var(--ok-bg);border-color:var(--ok)} .mp input{margin-top:3px;accent-color:var(--ok);width:17px;height:17px;flex-shrink:0}
.pm{display:inline-block;font-size:.68rem;font-weight:800;background:var(--surface-2);color:var(--text-2);padding:2px 7px;border-radius:999px;margin-right:7px}
.fb{margin-top:14px;padding:13px 15px;border-radius:12px;font-size:.9rem;border-left:4px solid}
.fb.good{background:var(--ok-bg);border-color:var(--ok)} .fb.part{background:var(--warn-bg);border-color:var(--warn)} .fb.poor{background:var(--bad-bg);border-color:var(--bad)}
.note{background:var(--warn-bg);border-left:4px solid var(--warn);padding:11px 14px;border-radius:0 10px 10px 0;font-size:.86rem;margin-top:10px}
.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin:14px 0}
.stat{background:var(--surface-2);border-radius:12px;padding:13px;text-align:center}
.stat b{display:block;font-size:1.4rem;font-weight:800} .stat span{font-size:.7rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.hide{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:12px;font-weight:700;font-size:.87rem;transition:transform .28s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:560px){.wrap{padding:16px 14px 50px}.card{padding:17px}}
/* ===== learn-from-scratch (shared, Gym house style) ===== */
#lm{max-width:860px;margin:0 auto}
#lm h1{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:6px}
#lm h2{font-size:1.2rem;margin-bottom:10px}
#lm h3{font-size:.98rem;margin-bottom:6px}
.lm-lede{color:var(--text-2);font-size:.95rem;margin-bottom:16px;max-width:64ch;line-height:1.6}
.lm-lede b{color:var(--text)}
.lm-small{font-size:.85rem;color:var(--text-2);margin:-6px 0 16px}
.lm-progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:16px}
.lm-progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
.lm-pill{display:inline-block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2);margin-right:5px}
.lm-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-bottom:14px}
.lm-body p{margin-bottom:10px;line-height:1.65}
.lm-banner{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:17px 19px;margin-bottom:18px;
  border-radius:16px;border:2px solid var(--accent);background:var(--accent-bg);box-shadow:var(--shadow);transition:transform .15s;
  font-family:inherit;color:var(--text);cursor:pointer}
.lm-banner:hover{transform:translateY(-2px)}
.lm-banner-icon{font-size:1.8rem;flex-shrink:0}
.lm-banner-body{flex:1;font-size:.95rem;line-height:1.45}
.lm-banner-body span{display:block;font-size:.84rem;color:var(--text-2);margin-top:3px}
.lm-banner-go{font-weight:800;font-size:.85rem;color:var(--accent);white-space:nowrap}
.lm-course,.lm-stage{display:flex;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface);
  box-shadow:var(--shadow);transition:all .14s;font-family:inherit;color:var(--text);cursor:pointer}
.lm-course{align-items:flex-start;gap:14px;padding:16px 18px;margin-bottom:11px;border-radius:16px}
.lm-course:hover,.lm-stage:hover{border-color:var(--accent)}
.lm-course.done,.lm-stage.done{background:var(--ok-bg);border-color:var(--ok)}
.lm-ci{font-size:1.7rem;flex-shrink:0;line-height:1.2}
.lm-cb{flex:1;font-size:.97rem;line-height:1.45}
.lm-cb>span{display:block;font-size:.84rem;color:var(--text-2);margin-top:3px}
.lm-tags{display:flex!important;gap:4px;flex-wrap:wrap;margin-top:8px!important}
.lm-cp{font-weight:800;font-size:.84rem;color:var(--accent);white-space:nowrap;padding-top:3px}
.lm-course.done .lm-cp{color:var(--ok)}
.lm-stage{align-items:center;gap:13px;padding:13px 16px;margin-bottom:9px;border-radius:12px}
.lm-stage.next{border-color:var(--accent);border-width:2px}
.lm-num{min-width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.82rem;color:var(--text-2)}
.lm-stage.done .lm-num{background:var(--ok);color:#fff}
.lm-stage.next .lm-num{background:var(--accent);color:#fff}
.lm-icon{font-size:1.25rem}
.lm-name{flex:1;font-weight:700}
.lm-go{font-size:.8rem;font-weight:800;color:var(--accent)}
.lm-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lm-qnum{font-weight:800;font-size:.85rem;background:var(--accent);color:#fff;padding:4px 12px;border-radius:999px}
.lm-count{margin-left:auto;font-size:.8rem;font-weight:800;color:var(--text-2)}
.lm-formula{background:var(--surface-2);border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0 6px;font-size:.93rem;line-height:1.55}
.lm-sub{font-size:.86rem;color:var(--text-2);margin:-2px 0 12px 4px;line-height:1.55}
.lm-tip{background:var(--warn-bg);border-left:4px solid var(--warn);padding:11px 14px;border-radius:0 10px 10px 0;font-size:.88rem;margin:14px 0 4px;line-height:1.55}
.lm-tip.good{background:var(--ok-bg);border-left-color:var(--ok)}
.lm-tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0 14px}
.lm-tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);padding:7px 8px;border-bottom:2px solid var(--border)}
.lm-tbl td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.lm-tbl.num td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lm-tbl tr.t td{border-top:1.5px solid var(--text);font-weight:800}
.lm-work{background:var(--surface-2);padding:13px 15px;border-radius:10px;font-size:.9rem;line-height:1.95;font-variant-numeric:tabular-nums;margin:8px 0}
.lm-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--border)}
.lm-row label{flex:1;font-weight:700;font-size:.9rem}
.lm-row input{width:130px;padding:8px 11px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.95rem;
  text-align:right;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.lm-row.ok input{border-color:var(--ok);background:var(--ok-bg)}
.lm-row.bad input{border-color:var(--bad);background:var(--bad-bg)}
.lm-mk{width:20px;font-weight:800;text-align:center}
.lm-mk.ok,.lm-okc{color:var(--ok)}.lm-mk.bad{color:var(--bad)}
.lm-fb{font-size:.84rem;color:var(--text-2);padding:6px 2px 10px;line-height:1.55}
.lm-stem{font-size:1rem;margin-bottom:14px;line-height:1.65}
.lm-opt{padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:9px;cursor:pointer;background:var(--surface);transition:all .13s}
.lm-opt:hover{border-color:var(--accent);background:var(--accent-bg)}
.lm-opt.locked{cursor:default}
.lm-opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.lm-opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.lm-why{font-size:.84rem;color:var(--text-2);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.lm-res{margin-top:14px;padding:13px 15px;border-radius:12px;font-size:.9rem;border-left:4px solid}
.lm-res.good{background:var(--ok-bg);border-color:var(--ok)}
.lm-res.part{background:var(--warn-bg);border-color:var(--warn)}
.lm-res.poor{background:var(--bad-bg);border-color:var(--bad)}
.lm-exp{margin-top:7px;padding-top:7px;border-top:1px solid rgba(128,128,128,.25)}
.lm-sort{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.lm-sort.ok{border-color:var(--ok);background:var(--ok-bg)}
.lm-sort.bad{border-color:var(--bad);background:var(--bad-bg)}
.lm-sort-t{font-size:.92rem;margin-bottom:9px;line-height:1.5}
.lm-chips{display:flex;flex-wrap:wrap;gap:6px}
.lm-chip{padding:5px 12px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);
  font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.lm-chip:hover{border-color:var(--accent)}
.lm-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lm-chip.right{background:var(--ok);border-color:var(--ok);color:#fff}
.lm-chip.wrongc{background:var(--bad);border-color:var(--bad);color:#fff;text-decoration:line-through}
.lm-chip:disabled{cursor:default}
.lm-sort-why{font-size:.84rem;color:var(--text-2);margin-top:9px;padding-top:8px;border-top:1px solid var(--border);line-height:1.55}
.lm-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.lm-wait{font-size:.82rem;color:var(--text-2)}
@media(max-width:560px){.lm-card{padding:17px}.lm-row input{width:105px}}

</style>
</head>
<body>
<header><div class="mast">
 <div class="brand">Scenario Question Trainer<span>Audit &amp; Assurance · Q9–Q12</span></div>
 <div class="spacer"></div>
 <div class="timer hide" id="timer">0:00</div>
 <button class="btn btn-sm" id="themeBtn" onclick="toggleTheme()">🌙</button>
 <button class="btn btn-sm" onclick="renderHome()">Menu</button>
</div></header>
<div class="wrap">
 <div id="home"></div>
 <div id="lm" class="hide"></div>
 <div id="case" class="hide"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ===================== LEARN FROM SCRATCH (shared engine) =====================
   Screens: explain · example · calc (fresh numbers) · mcq · sort.
   Configured per app with lmInit({...}). All names prefixed lm to avoid clashes. */
const LM = {cfg:null, L:null};
function lmInit(cfg){ LM.cfg = cfg; }
function lmShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lmProg(){ const s=LM.cfg.store(); s.learn = s.learn || {}; return s.learn; }
function lmDone(c){ const p=lmProg(); return c.stages.filter(s=>p[s.id]).length; }
function lmAll(){ return LM.cfg.courses.reduce((a,c)=>a+c.stages.length,0); }
function lmAllDone(){ return LM.cfg.courses.reduce((a,c)=>a+lmDone(c),0); }
function lmEsc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function lmShow(){
  LM.cfg.hide.forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add('hide'); });
  const r = document.getElementById('lm'); r.classList.remove('hide');
  return r;
}
function lmLeave(){ const r=document.getElementById('lm'); if(r) r.classList.add('hide'); LM.L = null; }
function lmBanner(){
  const d = lmAllDone(), t = lmAll();
  return `<button class="lm-banner" onclick="lmHub()">
    <span class="lm-banner-icon">📘</span>
    <span class="lm-banner-body"><b>${LM.cfg.bannerTitle}</b><span>${LM.cfg.bannerText}</span></span>
    <span class="lm-banner-go">${d ? d+' / '+t+' stages' : 'Begin →'}</span></button>`;
}

function lmHub(){
  const r = lmShow(); LM.L = null;
  const d = lmAllDone(), t = lmAll();
  r.innerHTML = `
   <button class="btn btn-sm" onclick="lmLeave();LM.cfg.home()" style="margin-bottom:14px">← Back to the drill</button>
   <h1>Learn from scratch</h1>
   <p class="lm-lede">${LM.cfg.hubIntro}</p>
   <div class="lm-progress"><div style="width:${t?d/t*100:0}%"></div></div>
   <p class="lm-small">${d} of ${t} stages complete</p>
   ${LM.cfg.courses.map((c,i)=>{ const n=lmDone(c), full=n===c.stages.length;
     return `<button class="lm-course ${full?'done':''}" onclick="lmCourse(${i})">
       <span class="lm-ci">${c.icon}</span>
       <span class="lm-cb"><b>${c.title}</b><span>${c.blurb}</span>
         <span class="lm-tags"><span class="lm-pill">${c.wb}</span><span class="lm-pill">${c.stages.length} stage${c.stages.length>1?'s':''}</span></span></span>
       <span class="lm-cp">${full?'✓ Done':(n?n+' / '+c.stages.length:'Start →')}</span></button>`; }).join('')}`;
  window.scrollTo(0,0);
}

function lmCourse(ci){
  const r = lmShow(); LM.L = null;
  const c = LM.cfg.courses[ci], p = lmProg(), done = lmDone(c);
  const next = c.stages.findIndex(s=>!p[s.id]);
  r.innerHTML = `
   <button class="btn btn-sm" onclick="lmHub()" style="margin-bottom:14px">← All courses</button>
   <h1>${c.icon} ${c.title}</h1>
   <p class="lm-lede">${c.blurb} <span class="lm-pill">${c.wb}</span></p>
   <div class="lm-progress"><div style="width:${done/c.stages.length*100}%"></div></div>

function lmExam(ci){ lmLeave(); LM.cfg.courses[ci].exam.go(); }

function lmStart(ci, si){ LM.L = {c:ci, s:si, k:0, ans:{}, sel:{}, shuf:{}, calc:null, calcKey:null}; lmRender(); }
function lmKey(){ return LM.L.c+'_'+LM.L.s+'_'+LM.L.k; }

function lmRender(){
  const L = LM.L, course = LM.cfg.courses[L.c], st = course.stages[L.s], sc = st.screens[L.k];
  const total = st.screens.length, key = lmKey();
  let body = '';
  if(sc.type==='explain' || sc.type==='example'){ body = sc.html; L.ans[key] = true; }

  if(sc.type==='calc'){
    if(!L.calc || L.calcKey!==key){ L.calc = sc.gen(); L.calcKey = key; }
    const c = L.calc;
    body = `<h2>${sc.title || 'Your turn'}</h2>
      <p>${sc.lead || 'Easy numbers, fresh every time. Work it out, then check — and use <b>New numbers</b> to go again.'}</p>
      ${c.intro}
      ${c.fields.map((f,j)=>`<div class="lm-row" id="lmr${j}"><label for="lmi${j}">${f.label}</label>
        <input id="lmi${j}" inputmode="decimal" autocomplete="off" onkeydown="if(event.key==='Enter')lmCheckCalc()">
        <span class="lm-mk" id="lmm${j}"></span></div><div class="lm-fb hide" id="lmf${j}"></div>`).join('')}
      <div class="lm-actions"><button class="btn btn-primary" onclick="lmCheckCalc()">Check</button>
        <button class="btn" onclick="LM.L.calc=null;delete LM.L.ans[lmKey()];lmRender()">New numbers</button></div>`;
  }

  if(sc.type==='mcq'){
    const a = L.ans[key];
    if(!L.shuf[key]) L.shuf[key] = lmShuffle(sc.options.map((_,i)=>i));
    body = `<h2>What does it mean?</h2><p class="lm-stem">${sc.q}</p>
      ${L.shuf[key].map(j=>{ const o=sc.options[j]; let cls='lm-opt';
        if(a!==undefined){ cls+=' locked'; if(o.ok) cls+=' correct'; else if(a===j) cls+=' wrong'; }
        return `<div class="${cls}" ${a===undefined?`onclick="lmMcq(${j})"`:''}><div>${o.t}
          ${a===j&&!o.ok&&o.why?`<div class="lm-why"><b>You picked this:</b> ${o.why}</div>`:''}</div></div>`; }).join('')}
      ${a!==undefined?`<div class="lm-res ${sc.options[a].ok?'good':'poor'}"><b>${sc.options[a].ok?'Exactly right.':'Not quite.'}</b><div class="lm-exp">${sc.explain}</div></div>`:''}`;
  }

  if(sc.type==='sort'){
    if(!L.shuf[key]) L.shuf[key] = lmShuffle(sc.items.map((_,i)=>i));
    const sel = L.sel[key] || (L.sel[key]={}), checked = L.ans[key];
    let right = 0;
    body = `<h2>Sort them</h2><p class="lm-stem">${sc.q}</p>
      ${L.shuf[key].map(i=>{ const it=sc.items[i], s=sel[i], ok=checked && s===it.ans; if(ok) right++;
        return `<div class="lm-sort ${checked?(ok?'ok':'bad'):''}"><div class="lm-sort-t">${it.t}</div>
          <div class="lm-chips">${sc.cats.map(cat=>{ let cls='lm-chip';
            if(s===cat) cls+=' on'; if(checked&&cat===it.ans) cls+=' right'; if(checked&&s===cat&&cat!==it.ans) cls+=' wrongc';
            return `<button class="${cls}" ${checked?'disabled':''} onclick="lmSort(${i},'${cat.replace(/'/g,"\\'")}')">${cat}</button>`; }).join('')}</div>
          ${checked?`<div class="lm-sort-why">${ok?'✓':'✗ <b>'+it.ans+'.</b>'} ${it.why}</div>`:''}</div>`; }).join('')}
      ${checked?`<div class="lm-res ${right===sc.items.length?'good':(right?'part':'poor')}"><b>${right} of ${sc.items.length} correct.</b></div>`
        :`<div class="lm-actions"><button class="btn btn-primary" onclick="lmCheckSort()">Check</button></div>`}`;
  }

  const last = L.k===total-1, canNext = (key in L.ans);
  const wait = {calc:'Check your answers to continue', mcq:'Pick an answer to continue', sort:'Sort every item, then check'}[sc.type];
  const r = document.getElementById('lm');
  r.innerHTML = `
   <button class="btn btn-sm" onclick="lmCourse(${L.c})" style="margin-bottom:14px">← ${course.title}</button>
   <div class="lm-head"><span class="lm-qnum">${st.icon} ${st.title}</span><span class="lm-count">${L.k+1} / ${total}</span></div>
   <div class="lm-progress"><div style="width:${(L.k+1)/total*100}%"></div></div>
   <div class="lm-card lm-body">${body}</div>
   <div class="lm-actions" id="lmNav">
     ${L.k>0?'<button class="btn" onclick="LM.L.k--;lmRender()">Back</button>':''}
     <button class="btn btn-primary" ${canNext?'':'disabled'} onclick="${last?'lmFinish()':'LM.L.k++;lmRender()'}">${last?'Finish stage ✓':'Next →'}</button>
     ${!canNext&&wait?`<span class="lm-wait">${wait}</span>`:''}</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function lmParse(v){
  const c = String(v||'').replace(/[,£%\s]/g,'').replace(/:1$/,'').replace(/^\((.*)\)$/,'-$1');
  return c==='' ? NaN : Number(c);
}
function lmCheckCalc(){
  const c = LM.L.calc; let blank = 0;
  c.fields.forEach((f,j)=>{
    const v = lmParse(document.getElementById('lmi'+j).value);
    const row=document.getElementById('lmr'+j), mk=document.getElementById('lmm'+j), fb=document.getElementById('lmf'+j);
    if(isNaN(v)){ blank++; return; }
    const tol = f.tol!=null ? f.tol : 0.5;
    const ok = Math.abs(v-f.ans) <= tol;
    row.className='lm-row '+(ok?'ok':'bad'); mk.textContent=ok?'✓':'✗'; mk.className='lm-mk '+(ok?'ok':'bad');
    fb.classList.remove('hide');
    if(ok) fb.innerHTML = '<span class="lm-okc">✓</span> '+f.show;
    else {
      const trap = (f.traps||[]).find(t=>Math.abs(v-t.v) <= Math.max(tol, 0.5));
      fb.innerHTML = (trap?'⚠️ '+trap.m+'<br>':'')+'The working: '+f.show;
    }
  });
  if(blank===c.fields.length){ LM.cfg.toast('Enter your answers first'); return; }
  LM.L.ans[lmKey()] = true;
  const b = document.querySelector('#lmNav .btn-primary'); if(b) b.disabled = false;
  document.querySelectorAll('#lmNav .lm-wait').forEach(x=>x.remove());
}
function lmMcq(j){ LM.L.ans[lmKey()] = j; lmRender(); }
function lmSort(i, cat){ LM.L.sel[lmKey()][i] = cat; lmRender(); }
function lmCheckSort(){
  const L=LM.L, sc=LM.cfg.courses[L.c].stages[L.s].screens[L.k];
  if(Object.keys(L.sel[lmKey()]||{}).length < sc.items.length){ LM.cfg.toast('Sort every item first'); return; }
  L.ans[lmKey()] = true; lmRender();
}
function lmFinish(){
  const L=LM.L, course=LM.cfg.courses[L.c], p=lmProg();
  p[course.stages[L.s].id] = true; LM.cfg.persist();
  const next = L.s+1, ci = L.c;
  if(next < course.stages.length){ LM.cfg.toast('Stage complete — on to '+course.stages[next].title); lmStart(ci, next); }
  else { LM.cfg.toast(course.title+' complete'); lmCourse(ci); }
}

 {id:'evidence', title:'Audit evidence', icon:'🔎', wb:'Workbook 5',

    <table class="lm-tbl">
     <tr><td><b>1. Obtained directly by the auditor</b></td><td>Most reliable — e.g. the auditor agreeing figures to the prior-year statements</td></tr>

 {id:'gc', title:'Going concern', icon:'⏳', wb:'Workbook 6',
  blurb:'Spotting indicators in a scenario, the procedures that test them, and the effect on the report.',
  exam:{label:'Practise the Makalata Ltd question', text:'June 2026 Q11 — the full 15-mark going concern question.', go:()=>scOpenCase('makalata')},
  stages:[{id:'sc-gc1', title:'Indicators, procedures and reporting', icon:'🚦', screens:[
   {type:'explain', html:`
    <h2>Material uncertainty</h2>
    <div class="lm-formula">A <b>material uncertainty related to going concern</b> arises when events or conditions, individually or together, cast significant doubt on the entity's ability to continue as a going concern — material where the likelihood and potential impact require disclosure of its nature and implications (June 2026 model)</div>
    <h3 style="margin:14px 0 6px">Indicator pattern: fact → why it threatens survival</h3>
    <div class="lm-work">"A major customer owing £567,000 has issued a notice of financial difficulty" → the cash may never arrive, and unless the customer is replaced future revenue and cash flow fall.</div>
    <h3 style="margin:14px 0 6px">Procedure pattern: match each indicator</h3>
    <p>Loss of a customer → review the post-year-end order book. Missed loan repayment → review the loan agreement and confirm the missed payment to the bank statement. Negative cash flow → obtain the cash flow forecast and test its assumptions. Always: <b>written representations</b> on management's plans.</p>
    <h3 style="margin:14px 0 6px">Reporting</h3>
    <table class="lm-tbl">
     <tr><td>Adequately disclosed</td><td>A <b>"Material uncertainty related to going concern"</b> section; opinion not modified</td></tr>
     <tr><td>Not adequately disclosed</td><td><b>Qualified or adverse</b> opinion</td></tr>
     <tr><td>Going concern basis inappropriate</td><td><b>Adverse</b></td></tr>
    </table>`},
   {type:'sort', q:'Going concern indicator — or not?', cats:['Indicator','Not an indicator'], items:[
     {t:'A major customer owing a large sum warns it can\u2019t meet its spending', ans:'Indicator', why:'Loss of cash and future revenue.'},
     {t:'A key director has left and hasn\u2019t been replaced', ans:'Indicator', why:'Future sales may fall, and customers may follow the director.'},
     {t:'Pension contributions have been delayed to save cash', ans:'Indicator', why:'A sign of cash shortage, with regulatory risk.'},
     {t:'The bank has agreed a new loan on lower repayments', ans:'Not an indicator', why:'That would <b>ease</b> the pressure \u2014 it\u2019s a mitigating factor.'},
     {t:'A loan repayment was missed and the bank threatens immediate repayment', ans:'Indicator', why:'A covenant breach could make the whole loan due.'}]}
  ]}]},

{id:'eldc', title:'East Lynn District Council — rental income', icon:'🏢', course:'controls', source:'December 2025 Q9', marks:15,
 scenario:`<p>East Lynn District Council has invested in commercial properties. Its main income is local taxation and government grants, but rental income is substantial.</p>

   <li>Properties are advertised through local agents and on the website. All prospective tenants are <b>credit checked</b>.</li>

/* ===================== SCENARIO TRAINER ENGINE ===================== */
const KEY = 'aa_scenario_trainer_v1';
let store = scLoad(), C = null, tick = null;
function scLoad(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return {theme:'light', learn:{}, cases:{}}; }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }
function applyTheme(){ document.documentElement.setAttribute('data-theme', store.theme==='dark'?'dark':'light');
  document.getElementById('themeBtn').textContent = store.theme==='dark'?'☀️':'🌙'; }
function toggleTheme(){ store.theme = store.theme==='dark'?'light':'dark'; applyTheme(); persist(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function show(id){ ['home','lm','case'].forEach(x=>document.getElementById(x).classList.toggle('hide', x!==id)); window.scrollTo(0,0); }
function stopTimer(){ if(tick){ clearInterval(tick); tick=null; } document.getElementById('timer').classList.add('hide'); }

/* ---------------- home ---------------- */
function renderHome(){
  stopTimer(); C = null; lmLeave(); show('home');
  const groups = SC_COURSES.filter(c=>CASES.some(k=>k.course===c.id));
  const done = Object.keys(store.cases).length;
  document.getElementById('home').innerHTML = `
    <h1>Scenario Question Trainer</h1>
    <p class="lede">Questions 9–12 are four 15-mark scenario questions — <b>60% of the paper</b>. They're written answers, marked point by point, and many ask for a specific table. This trainer teaches the answer <b>pattern</b> for each recurring type, then lets you practise on real past-paper questions with their official model answers.</p>
    ${lmBanner()}
    <div class="card">
      <h3>How each practice question works</h3>
      <div class="howgrid">
        <div><b>1 · Spot the points</b><span>Pick the genuine issues from a list with red herrings.</span></div>
        <div><b>2 · Build the table</b><span>Match each issue to its response, in the exam's table format.</span></div>
        <div><b>3 · Write it</b><span>Answer the real requirement, then self-mark against the model answer.</span></div>
      </div>
      <p class="small">Or choose <b>exam conditions</b> on any question: straight to writing, with a timer at 1½ minutes per mark.</p>
    </div>
    <h2 style="margin:20px 0 10px">Practice questions</h2>
    ${groups.map(g=>`<div class="grp"><div class="grp-h">${g.icon} ${g.title}</div>
      ${CASES.filter(k=>k.course===g.id).map(k=>{ const r=store.cases[k.id];
        return `<button class="case-btn ${r?'done':''}" onclick="scOpenCase('${k.id}')">
          <span class="cb-t"><b>${k.title}</b><span>${k.source} · ${k.marks} marks</span></span>
          <span class="cb-s">${r?(r.best!=null?'Best '+r.best+'/'+k.marks:'Practised'):'Start →'}</span></button>`; }).join('')}</div>`).join('')}
    <div class="card" style="margin-top:18px"><h3>About the sources</h3>
      <p class="small" style="margin:0">Every question and model answer comes from your papers: December 2023, December 2025, March 2026 and June 2026. Where a point is my own reasoning rather than the official answer, the app says so. ${done?`You've practised ${done} of ${CASES.length} questions.`:''}</p></div>`;
}

/* ---------------- a case ---------------- */
function scOpenCase(id){
  lmLeave(); stopTimer();
  const k = CASES.find(x=>x.id===id); if(!k){ toast('Question not found'); return; }
  C = null; show('case');
  const mins = Math.round(k.marks*1.5*10)/10;
  document.getElementById('case').innerHTML = `
    <button class="btn btn-sm" onclick="renderHome()" style="margin-bottom:14px">← All questions</button>
    <h1>${k.icon} ${k.title}</h1>
    <p class="lede">${k.source} · ${k.marks} marks</p>
    <div class="card scen">${k.scenario}</div>
    <div class="modes">
      <button class="mode" onclick="scStart('${k.id}','guided')"><h3>🪜 Guided</h3>
        <p>Spot the points, build the table, then write the answer. Best while you're learning the pattern.</p></button>
      <button class="mode" onclick="scStart('${k.id}','exam')"><h3>⏱️ Exam conditions</h3>
        <p>Straight to writing the real requirement, with a ${mins}-minute timer. Then self-mark.</p></button>
    </div>`;
}

function scStart(id, mode){
  const k = CASES.find(x=>x.id===id);
  const steps = mode==='exam' ? k.steps.filter(s=>s.kind==='write') : k.steps;
  C = {k, mode, steps, i:0, ans:{}, res:{}, shuf:{}, claimed:{}, endAt:null};
  if(mode==='exam'){
    C.endAt = Date.now() + k.marks*1.5*60*1000;
    document.getElementById('timer').classList.remove('hide');
    tick = setInterval(scTick, 1000); scTick();
  }
  scRender();
}
function scTick(){
  if(!C||!C.endAt) return;
  const left = Math.max(0, C.endAt-Date.now()), el=document.getElementById('timer');
  el.textContent = Math.floor(left/60000)+':'+String(Math.floor(left%60000/1000)).padStart(2,'0');
  el.classList.toggle('low', left<120000);
  if(left===0){ clearInterval(tick); tick=null; toast('Time\u2019s up — finish your sentence, then mark it'); }
}

function scRender(){
  const s = C.steps[C.i], key = C.i, done = key in C.res;
  let body = '';
  if(s.kind==='spot'){
    if(!C.shuf[key]) C.shuf[key] = shuffle(s.options.map((_,i)=>i));
    const sel = C.ans[key] || (C.ans[key]=[]);
    body = `<p class="stem">${s.q}</p>` + C.shuf[key].map(i=>{ const o=s.options[i], on=sel.includes(i);
      let cls='opt'+(on?' sel':'');
      if(done){ cls+=' locked'; if(o.ok&&on) cls+=' correct'; else if(o.ok) cls+=' missed'; else if(on) cls+=' wrong'; }
      return `<label class="${cls}" ${done?'':`onclick="scToggle(${i})"`}><input type="checkbox" ${on?'checked':''} ${done?'disabled':''} tabindex="-1">
        <div class="opt-body">${o.t}${done&&(on||o.ok)?`<div class="why">${o.ok?(on?'✓ ':'Missed: '):'✗ '}${o.why}</div>`:''}</div></label>`; }).join('');
  }
  if(s.kind==='match'){
    if(!C.shuf[key]) C.shuf[key] = shuffle(s.choices.map((_,i)=>i));
    const sel = C.ans[key] || (C.ans[key]={});
    body = `<p class="stem">${s.q}</p>` + s.rows.map((r,ri)=>{ const v=sel[ri], ok=done&&v===r.ans;
      return `<div class="mrow ${done?(ok?'ok':'bad'):''}"><div class="mrow-t">${r.t}</div>
        <select ${done?'disabled':''} onchange="scPick(${ri},this.value)"><option value="">— choose —</option>
        ${C.shuf[key].map(ci=>`<option value="${ci}" ${String(v)===String(ci)?'selected':''}>${s.choices[ci]}</option>`).join('')}</select>
        ${done&&!ok?`<div class="why">✗ The answer: <b>${s.choices[r.ans]}</b>${(s.decoyWhy&&v!=null&&s.decoyWhy[v])?'<br>'+s.decoyWhy[v]:''}</div>`:''}
        ${done&&ok?'<div class="why">✓ Correct</div>':''}</div>`; }).join('') + (s.note&&done?`<div class="note">${s.note}</div>`:'');
  }
  if(s.kind==='write'){
    const a = C.ans[key] || '';
    body = `<div class="req">${s.req}</div>
      <textarea id="scta" ${done||C.claimed[key]?'disabled':''} oninput="C.ans[${key}]=this.value;scActions()" placeholder="Write your answer here — use the table layout if the requirement asks for one">${a.replace(/</g,'&lt;')}</textarea>`;
    if(C.claimed[key]){
      const cl = C.claimed[key];
      body += `<div class="mark-h">Model answer — tick each point you genuinely made</div>` +
        s.points.map((p,pi)=>`<label class="mp ${cl.includes(pi)?'on':''}" ${done?'':`onclick="scClaim(${pi})"`}>
          <input type="checkbox" ${cl.includes(pi)?'checked':''} ${done?'disabled':''} tabindex="-1">
          <div><span class="pm">${p.m} mark${p.m===1?'':'s'}</span>${p.t}</div></label>`).join('');
    }
  }
  const last = C.i===C.steps.length-1;
  document.getElementById('case').innerHTML = `
    <button class="btn btn-sm" onclick="scOpenCase('${C.k.id}')" style="margin-bottom:12px">← ${C.k.title}</button>
    <div class="qhead"><span class="qnum">${C.mode==='exam'?'⏱️ Exam conditions':'Step '+(C.i+1)+' of '+C.steps.length}</span>
      <span class="tag">${s.title}</span><span class="marks">${s.kind==='write'?s.marks+' marks':'practice'}</span></div>
    <div class="progress"><div style="width:${(C.i+(done?1:0))/C.steps.length*100}%"></div></div>
    <details class="card scen-mini" ${C.i===0||s.kind==='write'?'open':''}><summary>📄 The scenario</summary>${C.k.scenario}</details>
    <div class="card">${body}<div id="res">${done?scResultLine(s,key):''}</div><div class="actions" id="acts"></div></div>`;
  scActions();
  window.scrollTo({top:0,behavior:'smooth'});
}
function scResultLine(s,key){
  const r = C.res[key];
  if(s.kind==='write') return `<div class="fb ${r.got>=s.marks*0.7?'good':(r.got>=s.marks*0.5?'part':'poor')}"><b>You scored ${r.got} / ${s.marks}</b> on your own marking. ${r.got>=s.marks*0.5?'That\u2019s a pass on this question.':'Look at which model points you missed — they\u2019re usually the "explain why" halves.'}</div>`;
  return `<div class="fb ${r.pct>=80?'good':(r.pct>=50?'part':'poor')}"><b>${r.pct}%</b> — ${r.pct>=80?'you\u2019ve got the points.':'read the explanations above, then try again later.'}</div>`;
}
function scActions(){
  const s = C.steps[C.i], key = C.i, done = key in C.res, h = document.getElementById('acts'); if(!h) return;
  const last = C.i===C.steps.length-1;
  let ready = false, label = 'Check';
  if(s.kind==='spot') ready = (C.ans[key]||[]).length>0;
  if(s.kind==='match') ready = Object.keys(C.ans[key]||{}).length===s.rows.length;
  if(s.kind==='write'){ if(C.claimed[key]){ ready = true; label='Record my score'; } else { ready = (C.ans[key]||'').trim().length>0; label='Mark against the model answer'; } }
  h.innerHTML = done
    ? `${C.i>0?'<button class="btn" onclick="C.i--;scRender()">Back</button>':''}
       <button class="btn btn-primary" onclick="${last?'scFinish()':'C.i++;scRender()'}">${last?'See results':'Next →'}</button>`
    : `${C.i>0?'<button class="btn" onclick="C.i--;scRender()">Back</button>':''}
       <button class="btn btn-primary" ${ready?'':'disabled'} onclick="scCheck()">${label}</button>
       ${s.kind==='write'&&!C.claimed[key]?'<button class="btn" onclick="scSkipWrite()">Just show me the model answer</button>':''}`;
}
function scToggle(i){ const a=C.ans[C.i]; const k=a.indexOf(i); if(k>-1) a.splice(k,1); else a.push(i); scRender(); }
function scPick(ri, v){ const a=C.ans[C.i]; if(v==='') delete a[ri]; else a[ri]=Number(v); scActions(); }
function scClaim(pi){ const cl=C.claimed[C.i]; const k=cl.indexOf(pi); if(k>-1) cl.splice(k,1); else cl.push(pi); scRender(); }
function scSkipWrite(){ C.ans[C.i] = C.ans[C.i] || ''; C.claimed[C.i] = []; scRender(); }
function scCheck(){
  const s = C.steps[C.i], key = C.i;
  if(s.kind==='spot'){
    const sel=C.ans[key], right=s.options.filter(o=>o.ok).length;
    const hit=sel.filter(i=>s.options[i].ok).length, wrong=sel.filter(i=>!s.options[i].ok).length;
    C.res[key] = {pct: Math.max(0, Math.round((hit-wrong)/right*100))};
  }
  if(s.kind==='match'){
    const sel=C.ans[key]; const ok=s.rows.filter((r,ri)=>sel[ri]===r.ans).length;
    C.res[key] = {pct: Math.round(ok/s.rows.length*100)};
  }
  if(s.kind==='write'){
    if(!C.claimed[key]){ C.claimed[key] = []; scRender(); return; }
    const got = Math.min(s.marks, C.claimed[key].reduce((a,pi)=>a+s.points[pi].m,0));
    C.res[key] = {got: Math.round(got*100)/100};
  }
  scRender();
}
function scFinish(){
  stopTimer();
  const k = C.k, w = C.steps.map((s,i)=>s.kind==='write'?C.res[i]:null).filter(Boolean);
  const got = w.reduce((a,r)=>a+r.got,0);
  const prac = C.steps.map((s,i)=>s.kind!=='write'?C.res[i]:null).filter(Boolean);
  const pp = prac.length ? Math.round(prac.reduce((a,r)=>a+r.pct,0)/prac.length) : null;
  const rec = store.cases[k.id] || {attempts:0, best:null};
  rec.attempts++; if(w.length && (rec.best==null || got>rec.best)) rec.best = Math.round(got*100)/100;
  store.cases[k.id] = rec; persist();
  document.getElementById('case').innerHTML = `
    <div class="card"><h1>${k.icon} ${k.title} — done</h1>
     <div class="stats">
      ${w.length?`<div class="stat"><b>${Math.round(got*100)/100}/${k.marks}</b><span>Written (self-marked)</span></div>`:''}
      ${pp!=null?`<div class="stat"><b>${pp}%</b><span>Spotting &amp; tables</span></div>`:''}
      <div class="stat"><b>${rec.attempts}</b><span>Attempts</span></div></div>
     <p class="small">${w.length&&got>=k.marks*0.5?'Above half marks on this question — that\u2019s the pass standard.':'The model points you missed are the ones to drill — usually the "why it matters" half of each point.'}</p>
     <div class="actions"><button class="btn btn-primary" onclick="scOpenCase('${k.id}')">Try again</button>
      <button class="btn" onclick="renderHome()">All questions</button></div></div>`;
  window.scrollTo(0,0);
}

lmInit({courses:SC_COURSES, hide:['home','case'], home:renderHome, store:()=>store, persist:persist, toast:toast,
  bannerTitle:'New to scenario questions? Start here.',
  bannerText:'Seven short courses, one per answer pattern — ethics, assertions, controls, evidence, going concern and investigations.',
  hubIntro:'Each course teaches one answer pattern in plain English, shows a real model-answer example, and checks you\u2019ve got it — then hands you to a past-paper question that uses it.'});
applyTheme(); renderHome();

</script>
</body>
